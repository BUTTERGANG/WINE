<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" fill="none">
  <!-- Wine glass -->
  <defs>
    <linearGradient id="glass" x1="60" y1="160" x2="60" y2="0">
      <stop offset="0%" stop-color="#e98844" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#e98844" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#d45518" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d45518" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="glow" x1="60" y1="0" x2="60" y2="50">
      <stop offset="0%" stop-color="#f6cfaa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e98844" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e98844" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#e98844" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#e98844" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Bowl -->
  <path d="M30 28C30 28 22 68 28 100C30 112 36 118 60 120C84 118 90 112 92 100C98 68 90 28 90 28"
        fill="url(#glass)" stroke="#e98844" stroke-width="1.5" stroke-opacity="0.5"/>
  
  <!-- Wine surface glow -->
  <ellipse cx="60" cy="34" rx="26" ry="5" fill="url(#glow)" opacity="0.5"/>

  <!-- Highlight -->
  <path d="M38 34C38 34 35 60 38 85"
        stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.25"/>

  <!-- Stem -->
  <line x1="60" y1="120" x2="60" y2="148" stroke="url(#stem)" stroke-width="2.5"/>

  <!-- Base -->
  <ellipse cx="60" cy="152" rx="24" ry="3" fill="#e98844" fill-opacity="0.25" stroke="#e98844" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Drop accent -->
  <circle cx="96" cy="104" r="2.5" fill="#e98844" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="104;110;104" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Drop accent 2 -->
  <circle cx="24" cy="108" r="1.5" fill="#d45518" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="108;115;108" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>