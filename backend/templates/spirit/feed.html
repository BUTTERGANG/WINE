{% extends "base.html" %}
{% block title %}Spirits Feed{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8" data-animate>
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-display">🥃 Spirits</h1>
            <p class="text-sm text-neutral-400">What everyone's drinking</p>
        </div>
        <div class="flex gap-2">
            <a href="/spirit/add" class="bg-wine-600 hover:bg-wine-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">+ Log</a>
            <a href="/spirit/distilleries" class="border border-neutral-700 hover:border-wine-500 px-3 py-1.5 rounded-lg text-xs transition">Distilleries</a>
        </div>
    </div>

    {% if user %}
    <div class="flex items-center gap-2 mb-4">
        <button id="feed-global" class="px-3 py-1.5 rounded-md text-xs font-medium bg-wine-600 text-white transition"
                onclick="switchFeed('global')">🌍 Global</button>
        <button id="feed-groups" class="px-3 py-1.5 rounded-md text-xs text-neutral-400 hover:text-white transition"
                onclick="switchFeed('groups')">👥 Groups</button>
        <select id="group-selector" class="hidden bg-neutral-800 border border-neutral-700 rounded-lg px-2 py-1.5 text-xs text-neutral-300"
                onchange="loadGroupFeed(this.value)">
            <option value="">Select a group…</option>
        </select>
    </div>
    {% endif %}

    <div class="grid grid-cols-2 md:grid-cols-3 gap-3" id="spirit-feed" data-reveal-list>
        <div class="col-span-full">
            <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
            </div>
        </div>
    </div>
</div>
<script>
(function () {
    const container = document.getElementById('spirit-feed');
    let mode = 'global';
    let groupId = '';

    function spiritColor(type) {
        var colors = { whiskey: '#3e150b', bourbon: '#3d2a18', scotch: '#2e1a0e', rye: '#3e150b', irish: '#2a2418', japanese: '#2a1f0e' };
        return colors[type] || '#1a1714';
    }

    function cardHTML(item) {
        var photoHTML = item.photo_url
            ? '<div class="aspect-square overflow-hidden mb-2 cursor-zoom-in" onclick="openLightbox(\'' + esc(item.photo_url) + '\')">' +
              '<img src="' + esc(item.photo_url) + '" alt="" loading="lazy" class="w-full h-full object-cover"></div>'
            : '<div class="aspect-square flex items-center justify-center text-3xl" style="background:' + spiritColor(item.spirit_type) + '">🥃</div>';
        return '<div class="bg-neutral-900 rounded-xl border border-neutral-800 hover:border-neutral-700 transition overflow-hidden">' +
            photoHTML +
            '<div class="p-3">' +
              '<a href="/spirit/' + encodeURIComponent(item.spirit_id) + '" class="text-sm font-medium text-wine-300 hover:text-wine-200 truncate block">' + esc(item.display) + '</a>' +
              '<div class="flex items-center justify-between mt-0.5">' +
                '<span class="text-xs text-neutral-500">' + esc(item.username) + '</span>' +
                '<span class="text-xs text-yellow-500">' + stars(item.rating) + '</span>' +
              '</div>' +
            '</div>' +
        '</div>';
    }

    function renderItems(items) {
        if (!items.length) {
            container.innerHTML = '<div class="text-center py-16 col-span-full"><div class="text-5xl mb-4">🥃</div><p class="text-neutral-500">No spirits logged yet. <a href="/spirit/add" class="text-wine-400 hover:underline">Be the first!</a></p></div>';
            return;
        }
        container.innerHTML = items.map(cardHTML).join('');
        revealChildren(container);
    }

    function switchFeed(newMode) {
        mode = newMode;
        document.getElementById('feed-global').className = 'px-3 py-1.5 rounded-md text-xs font-medium transition ' +
            (mode === 'global' ? 'bg-wine-600 text-white' : 'text-neutral-400 hover:text-white');
        document.getElementById('feed-groups').className = 'px-3 py-1.5 rounded-md text-xs font-medium transition ' +
            (mode === 'groups' ? 'bg-wine-600 text-white' : 'text-neutral-400 hover:text-white');
        document.getElementById('group-selector').classList.toggle('hidden', mode !== 'groups');
        if (mode === 'groups') {
            loadGroups();
        } else {
            loadFeed();
        }
    }

    function loadGroups() {
        fetch('/api/groups?category=spirits')
            .then(r => r.json())
            .then(d => {
                const sel = document.getElementById('group-selector');
                sel.innerHTML = '<option value="">Select a group…</option>' +
                    (d.groups || []).map(g => '<option value="' + g.id + '">' + esc(g.name) + ' (' + g.member_count + ' members)</option>').join('');
                if (groupId) { sel.value = groupId; if (groupId) loadGroupFeed(groupId); }
            });
    }

    function loadGroupFeed(gid) {
        if (!gid) { container.innerHTML = '<div class="text-center py-8 text-neutral-500 col-span-full">Select a group above to see their tastings.</div>'; return; }
        groupId = gid;
        fetch('/api/spirits/feed/groups?group_id=' + encodeURIComponent(gid))
            .then(r => r.json())
            .then(d => renderItems(d.items || []));
    }

    function loadFeed() {
        fetch('/api/spirits/feed')
            .then(r => r.json())
            .then(d => renderItems(d.items || []));
    }

    loadFeed();
})();
</script>
{% endblock %}
