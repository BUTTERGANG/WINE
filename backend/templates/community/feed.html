{% extends "base.html" %}
{% block title %}Feed{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8" data-animate>
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-display">🍷 Community Feed</h1>
            <p class="text-sm text-neutral-400">What everyone's drinking</p>
        </div>
        {% if user %}
        <div class="flex bg-neutral-900 rounded-lg p-0.5 border border-neutral-800">
            <button id="feed-global" class="px-3 py-1.5 rounded-md text-xs font-medium bg-wine-600 text-white transition"
                    onclick="switchFeed('global')">🌍 Global</button>
            <button id="feed-personal" class="px-3 py-1.5 rounded-md text-xs text-neutral-400 hover:text-white transition"
                    onclick="switchFeed('personal')">👥 Following</button>
        </div>
        {% endif %}
    </div>

    <div id="feed-page" data-reveal-list>
        <div class="text-neutral-500 text-center py-8">Loading feed…</div>
    </div>
</div>

<script>
const feedContainer = document.getElementById('feed-page');

function switchFeed(mode) {
    if (document.getElementById('feed-global')) {
        document.getElementById('feed-global').className = 'px-3 py-1.5 rounded-md text-xs font-medium transition ' +
            (mode === 'global' ? 'bg-wine-600 text-white' : 'text-neutral-400 hover:text-white');
        document.getElementById('feed-personal').className = 'px-3 py-1.5 rounded-md text-xs font-medium transition ' +
            (mode === 'personal' ? 'bg-wine-600 text-white' : 'text-neutral-400 hover:text-white');
    }
    loadFeed(mode === 'personal' ? '/api/feed/personal?limit=50' : '/api/feed?limit=50', mode);
}

function loadFeed(url, mode) {
    feedContainer.innerHTML = '<div class="text-neutral-500 text-center py-8">Loading feed…</div>';
    fetch(url)
        .then(r => r.json())
        .then(d => renderFeed(d.items || [], mode))
        .catch(() => { feedContainer.innerHTML = '<div class="text-neutral-500 text-center py-8">Could not load the feed.</div>'; });
}

function renderFeed(items, mode) {
    if (!items.length) {
        feedContainer.innerHTML = mode === 'personal'
            ? '<div class="text-neutral-500 text-center py-8">Nothing here yet — <a href="/feed" class="text-wine-400 hover:underline" onclick="switchFeed(\'global\');return false;">browse the global feed</a> and follow some people.</div>'
            : '<div class="text-neutral-500 text-center py-8">No tastings yet. <a href="/wine/add" class="text-wine-400 hover:underline">Add the first!</a></div>';
        return;
    }
    feedContainer.innerHTML = items.map(function (item) {
        const photo = item.photo_url
            ? '<img src="' + esc(item.photo_url) + '" alt="" loading="lazy" class="w-14 h-14 rounded-lg object-cover border border-neutral-800 flex-shrink-0">' : '';
        const loc = item.location_name ? '<span class="text-neutral-400">📍 ' + esc(item.location_name) + '</span>' : '';
        const notes = item.notes ? '<p class="text-sm text-neutral-400 mt-2 italic">“' + esc(item.notes) + '”</p>' : '';
        return '' +
          '<div class="bg-neutral-900 rounded-xl p-4 border border-neutral-800 hover:border-neutral-700 transition mb-3">' +
            '<div class="flex items-start gap-3">' +
              '<a href="/profile/' + encodeURIComponent(item.user_id) + '" class="w-10 h-10 rounded-full bg-neutral-800 flex items-center justify-center text-sm font-bold flex-shrink-0 hover:bg-wine-600 transition">' +
                esc((item.username || '?').charAt(0).toUpperCase()) + '</a>' +
              '<div class="flex-1 min-w-0">' +
                '<div class="flex items-center gap-2">' +
                  '<a href="/profile/' + encodeURIComponent(item.user_id) + '" class="font-medium text-sm hover:text-wine-300">' + esc(item.username) + '</a>' +
                  '<span class="text-neutral-500">·</span>' +
                  '<span class="text-xs text-neutral-500">' + fmtDate(item.created_at) + '</span>' +
                '</div>' +
                '<div class="flex items-start gap-3 mt-1">' +
                  '<div class="flex-1 min-w-0">' +
                    '<a href="/wine/' + encodeURIComponent(item.wine_id) + '" class="block text-lg font-display text-wine-300 hover:text-wine-200">' + esc(item.wine_name) + '</a>' +
                    '<div class="flex flex-wrap items-center gap-3 mt-1 text-sm">' +
                      '<span class="text-yellow-500">' + stars(item.rating) + '</span>' + loc +
                    '</div>' + notes +
                  '</div>' + photo +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>';
    }).join('');
}

loadFeed('/api/feed?limit=50', 'global');
</script>
{% endblock %}
