{% extends "base.html" %}
{% block title %}Feed{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8" data-animate>
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-display">🍷 Community Feed</h1>
            <p class="text-sm text-neutral-400">What everyone's drinking</p>
        </div>
        {% if user %}
        <div class="flex bg-neutral-900 rounded-lg p-0.5 border border-neutral-800">
            <button id="feed-global" class="px-3 py-1.5 rounded-md text-xs font-medium bg-wine-600 text-white transition"
                    onclick="switchFeed('global')">🌍 Global</button>
            <button id="feed-personal" class="px-3 py-1.5 rounded-md text-xs text-neutral-400 hover:text-white transition"
                    onclick="switchFeed('personal')">👥 Following</button>
        </div>
        {% endif %}
    </div>

    <div id="feed-page" class="grid grid-cols-2 md:grid-cols-3 gap-3" data-reveal-list>
        <div class="col-span-full">
            <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
            </div>
        </div>
    </div>
    <div id="feed-load-more" class="text-center mt-6 hidden">
        <button onclick="loadMoreFeed()" class="bg-neutral-800 hover:bg-neutral-700 text-neutral-300 px-6 py-2.5 rounded-lg text-sm border border-neutral-700 transition">Load More</button>
    </div>
</div>

<script>
const feedContainer = document.getElementById('feed-page');
let feedOffset = 0;
let feedMode = 'global';
const FEED_LIMIT = 12;

function wineColor(type) {
    var colors = { red: '#3e150b', white: '#2a2418', rosé: '#3d1f2e', sparkling: '#2a1f0e', fortified: '#2e1a0e', dessert: '#2e1a0e' };
    return colors[type] || '#1a1714';
}

function switchFeed(mode) {
    feedMode = mode;
    feedOffset = 0;
    document.getElementById('feed-global').className = 'px-3 py-1.5 rounded-md text-xs font-medium transition ' +
        (mode === 'global' ? 'bg-wine-600 text-white' : 'text-neutral-400 hover:text-white');
    document.getElementById('feed-personal').className = 'px-3 py-1.5 rounded-md text-xs font-medium transition ' +
        (mode === 'personal' ? 'bg-wine-600 text-white' : 'text-neutral-400 hover:text-white');
    loadFeed();
}

function loadFeed() {
    var url = (feedMode === 'personal' ? '/api/feed/personal?limit=' : '/api/feed?limit=') + FEED_LIMIT + '&offset=' + feedOffset;
    fetch(url)
        .then(function (r) { return r.json(); })
        .then(function (d) {
            var items = d.items || [];
            if (feedOffset === 0 && !items.length) {
                feedContainer.innerHTML = feedMode === 'personal'
                    ? '<div class="empty-state col-span-full"><div class="icon">👥</div><h3>Nothing here yet</h3><p>Follow some people to see their tastings here.</p><a href="/feed" class="action" onclick="switchFeed(\'global\');return false">Browse global feed</a></div>'
                    : '<div class="empty-state col-span-full"><div class="icon">🍷</div><h3>No tastings yet</h3><p>The community is just getting started. Be the first to log a wine!</p><a href="/wine/add" class="action">Log a wine</a></div>';
                document.getElementById('feed-load-more').classList.add('hidden');
                return;
            }
            if (feedOffset === 0) {
                feedContainer.innerHTML = items.map(itemHtml).join('');
            } else {
                var frag = document.createDocumentFragment();
                items.forEach(function (item) {
                    var div = document.createElement('div');
                    div.className = 'reveal-item';
                    div.innerHTML = itemHtml(item);
                    frag.appendChild(div);
                });
                feedContainer.appendChild(frag);
            }
            feedOffset += items.length;
            document.getElementById('feed-load-more').classList.toggle('hidden', items.length < FEED_LIMIT);
            revealChildren(feedContainer);
        })
        .catch(function () {
            if (feedOffset === 0) {
                feedContainer.innerHTML = '<div class="text-center py-8 text-neutral-500 col-span-full">Could not load the feed.</div>';
            }
        });
}

function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function stars(n) { return '★'.repeat(Math.min(Math.max(n|0,0),5)) + '☆'.repeat(Math.max(5-Math.min(Math.max(n|0,0),5),0)); }

function itemHtml(item) {
    var photoHTML = item.photo_url
        ? '<div class="aspect-square rounded-lg overflow-hidden mb-2 cursor-zoom-in" onclick="openLightbox(\'' + esc(item.photo_url) + '\')"><img src="' + esc(item.photo_url) + '" alt="" loading="lazy" class="w-full h-full object-cover"></div>'
        : '<div class="aspect-square rounded-lg mb-2 flex items-center justify-center text-3xl" style="background:' + wineColor(item.wine_type) + '">🍷</div>';
    var locHTML = item.location_name
        ? '<div class="mt-1 text-xs text-neutral-500 truncate">📍 ' + esc(item.location_name) + '</div>'
        : '';
    return '<div class="bg-neutral-900 rounded-xl border border-neutral-800 hover:border-neutral-700 transition overflow-hidden">' +
        photoHTML +
        '<div class="p-3">' +
          '<a href="/wine/' + encodeURIComponent(item.wine_id) + '" class="text-sm font-medium text-wine-300 hover:text-wine-200 truncate block">' + esc(item.wine_name) + '</a>' +
          '<div class="flex items-center justify-between mt-0.5">' +
            '<span class="text-xs text-neutral-500">by <a href="/profile/' + encodeURIComponent(item.user_id) + '" class="hover:text-wine-300">' + esc(item.username) + '</a></span>' +
            '<span class="text-xs text-yellow-500">' + stars(item.rating) + '</span>' +
          '</div>' + locHTML +
        '</div>' +
    '</div>';
}

function loadMoreFeed() { loadFeed(); }
</script>
{% endblock %}
