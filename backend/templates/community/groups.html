{% extends "base.html" %}
{% block title %}Groups{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8" data-animate>
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-display">🍷 Wine Groups</h1>
            <p class="text-sm text-neutral-400">Taste together, share together</p>
        </div>
        {% if user %}
        <button onclick="toggleCreate()" class="bg-wine-600 hover:bg-wine-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
            + New Group
        </button>
        {% endif %}
    </div>

    {% if user %}
    <div id="create-group-form" class="bg-neutral-900 rounded-xl p-6 border border-neutral-800 mb-6 hidden">
        <h3 class="font-semibold mb-4">Create a Group</h3>
        <form id="new-group" class="space-y-3">
            <input type="text" name="name" placeholder="Group name" required
                class="w-full bg-neutral-800 border border-neutral-700 rounded-lg px-3 py-2.5 text-sm focus:border-wine-500 focus:outline-none">
            <input type="text" name="description" placeholder="Description (optional)"
                class="w-full bg-neutral-800 border border-neutral-700 rounded-lg px-3 py-2.5 text-sm focus:border-wine-500 focus:outline-none">
            <label class="flex items-center gap-2 text-sm text-neutral-400">
                <input type="checkbox" name="is_private" value="1" class="rounded border-neutral-700 bg-neutral-800">
                Private group
            </label>
            <div id="group-err" class="text-sm text-red-400 hidden"></div>
            <button type="submit" class="bg-wine-600 hover:bg-wine-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                Create Group
            </button>
        </form>
    </div>
    {% endif %}

    <div id="group-list" data-reveal-list>
        <div class="text-neutral-500 text-center py-8">Loading groups…</div>
    </div>
</div>

<script>
const groupList = document.getElementById('group-list');

function toggleCreate() {
    document.getElementById('create-group-form').classList.toggle('hidden');
}

function renderGroups(groups) {
    if (!groups.length) {
        groupList.innerHTML = '<div class="text-neutral-500 text-center py-8">No groups yet. Create the first one!</div>';
        return;
    }
    groupList.innerHTML = groups.map(function (g) {
        const desc = g.description ? '<p class="text-sm text-neutral-400 mt-1">' + esc(g.description) + '</p>' : '';
        return '' +
          '<div class="bg-neutral-900 rounded-xl p-4 border border-neutral-800 hover:border-neutral-700 transition mb-3">' +
            '<a href="/group/' + encodeURIComponent(g.id) + '" class="text-lg font-display text-wine-300 hover:text-wine-200">' + esc(g.name) + '</a>' +
            desc +
            '<div class="flex items-center gap-3 mt-2 text-xs text-neutral-500">' +
              '<span>👥 ' + (parseInt(g.member_count) || 0) + ' members</span>' +
              '<span>📅 ' + fmtDate(g.created_at) + '</span>' +
            '</div>' +
          '</div>';
    }).join('');
}

function loadGroups() {
    fetch('/api/groups')
        .then(r => r.json())
        .then(d => renderGroups(d.groups || []))
        .catch(() => { groupList.innerHTML = '<div class="text-neutral-500 text-center py-8">Could not load groups.</div>'; });
}

const newGroupForm = document.getElementById('new-group');
if (newGroupForm) {
    newGroupForm.addEventListener('submit', function (e) {
        e.preventDefault();
        const err = document.getElementById('group-err');
        err.classList.add('hidden');
        fetch('/api/groups', { method: 'POST', body: new FormData(newGroupForm) })
            .then(async function (r) {
                const data = await r.json().catch(() => ({}));
                if (!r.ok) throw new Error(data.detail || 'Could not create group');
                newGroupForm.reset();
                document.getElementById('create-group-form').classList.add('hidden');
                renderGroups(data.groups || []);
            })
            .catch(function (ex) { err.textContent = ex.message; err.classList.remove('hidden'); });
    });
}

loadGroups();
</script>
{% endblock %}
