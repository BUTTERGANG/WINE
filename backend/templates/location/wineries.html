{% extends "base.html" %}
{% block title %}Wineries{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold">🏘️ Wineries</h1>
            <p class="text-sm text-neutral-500">Discover wineries and see what people are drinking there</p>
        </div>
        {% if user %}
        <button onclick="showImportForm()" class="bg-wine-600 hover:bg-wine-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
            + Import Wineries
        </button>
        {% endif %}
    </div>

    <!-- Search + filters -->
    <div class="mb-6">
        <div class="relative">
            <input type="text" id="winery-search" placeholder="Search by name or wine region (e.g. Napa Valley)…"
                class="w-full bg-neutral-900 border border-neutral-700 rounded-xl px-4 py-3 pl-10 text-sm focus:border-wine-500 focus:outline-none"
                oninput="runSearch()"
                autocomplete="off">
            <span class="absolute left-3 top-3 text-neutral-500">🔍</span>
        </div>

        <div class="flex flex-wrap items-center gap-2 mt-3">
            <select id="filter-region" onchange="runSearch()"
                class="bg-neutral-900 border border-neutral-700 rounded-lg px-3 py-2 text-xs text-neutral-300 focus:border-wine-500 focus:outline-none">
                <option value="">All wine regions</option>
            </select>
            <select id="filter-sort" onchange="runSearch()"
                class="bg-neutral-900 border border-neutral-700 rounded-lg px-3 py-2 text-xs text-neutral-300 focus:border-wine-500 focus:outline-none">
                <option value="name">Sort: Name (A–Z)</option>
                <option value="tastings">Sort: Most tastings</option>
            </select>
            <label class="flex items-center gap-1.5 text-xs text-neutral-400 px-2 py-2 cursor-pointer select-none">
                <input type="checkbox" id="filter-tastings" onchange="runSearch()" class="accent-wine-500">
                Community favorites only
            </label>
            <button type="button" id="filter-clear" onclick="clearFilters()"
                class="hidden text-xs text-neutral-500 hover:text-wine-400 underline px-2 py-2">Clear</button>
        </div>

        <div id="winery-count" class="mt-3 text-xs text-neutral-500 hidden"></div>
        <div id="winery-results" class="mt-2 space-y-2"></div>
    </div>

    <!-- Import form -->
    <div id="import-form" class="bg-neutral-900 rounded-xl p-6 border border-neutral-800 mb-6 hidden">
        <h3 class="font-semibold mb-4">Import Wineries</h3>
        <p class="text-sm text-neutral-500 mb-4">Search OpenStreetMap for wineries near a location or by name.</p>
        <form hx-post="/api/wineries/import" hx-target="#import-result" hx-swap="innerHTML" class="space-y-3">
            <input type="text" name="query" placeholder="Region or winery name (e.g. Napa Valley)" 
                class="w-full bg-neutral-800 border border-neutral-700 rounded-lg px-3 py-2.5 text-sm">
            <div class="grid grid-cols-2 gap-3">
                <input type="number" name="lat" step="0.0001" placeholder="Latitude (optional)" 
                    class="w-full bg-neutral-800 border border-neutral-700 rounded-lg px-3 py-2.5 text-sm">
                <input type="number" name="lon" step="0.0001" placeholder="Longitude (optional)"
                    class="w-full bg-neutral-800 border border-neutral-700 rounded-lg px-3 py-2.5 text-sm">
            </div>
            <div>
                <label class="text-xs text-neutral-500">Radius (km): <span id="import-radius-label">100</span></label>
                <input type="range" name="radius" min="10" max="500" value="100" 
                    class="w-full accent-wine-500"
                    oninput="document.getElementById('import-radius-label').textContent=this.value">
            </div>
            <button type="submit" class="bg-wine-600 hover:bg-wine-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                🔍 Find & Import
            </button>
        </form>
        <div id="import-result" class="mt-3"></div>
    </div>
</div>

<script>
let searchTimer;
const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; };

// Populate the region dropdown once.
fetch('/api/wineries/regions')
    .then(r => r.json())
    .then(data => {
        const sel = document.getElementById('filter-region');
        (data.regions || []).forEach(r => {
            const o = document.createElement('option');
            o.value = r.region;
            o.textContent = `${r.region} (${r.count})`;
            sel.appendChild(o);
        });
    })
    .catch(() => {});

function currentFilters() {
    return {
        q: document.getElementById('winery-search').value.trim(),
        region: document.getElementById('filter-region').value,
        sort: document.getElementById('filter-sort').value,
        tastings: document.getElementById('filter-tastings').checked,
    };
}

function runSearch() {
    clearTimeout(searchTimer);
    const f = currentFilters();
    const active = f.q || f.region || f.tastings;
    document.getElementById('filter-clear').classList.toggle('hidden', !(f.region || f.tastings || f.sort !== 'name'));

    const results = document.getElementById('winery-results');
    const countEl = document.getElementById('winery-count');
    if (!active) {
        results.innerHTML = '';
        countEl.classList.add('hidden');
        return;
    }

    searchTimer = setTimeout(() => {
        const params = new URLSearchParams();
        if (f.q) params.set('q', f.q);
        if (f.region) params.set('region', f.region);
        if (f.tastings) params.set('has_tastings', 'true');
        params.set('sort', f.sort);

        fetch('/api/wineries/search?' + params.toString())
            .then(r => r.json())
            .then(data => {
                const items = data.results || [];
                countEl.textContent = items.length
                    ? `${items.length}${items.length === 60 ? '+' : ''} winer${items.length === 1 ? 'y' : 'ies'}`
                      + (f.region ? ` in ${f.region}` : '')
                    : '';
                countEl.classList.toggle('hidden', !items.length);

                if (!items.length) {
                    results.innerHTML = '<div class="text-neutral-600 text-sm text-center py-6">No wineries match these filters.</div>';
                    return;
                }
                results.innerHTML = items.map(w => `
                    <a href="/venue/${w.id || '#'}" class="block bg-neutral-900 rounded-xl p-4 border border-neutral-800 hover:border-neutral-700 transition ${!w.id ? 'opacity-60' : ''}">
                        <div class="flex items-start gap-3">
                            <div class="text-2xl">🏘️</div>
                            <div class="min-w-0">
                                <div class="font-medium">${esc(w.name)} ${!w.local ? '<span class="text-xs text-neutral-500">(not imported)</span>' : ''}</div>
                                <div class="flex flex-wrap gap-1.5 mt-1">
                                    ${w.region ? `<span class="text-[11px] bg-neutral-800 text-neutral-300 rounded px-1.5 py-0.5">📍 ${esc(w.region)}</span>` : ''}
                                    ${w.tasting_count ? `<span class="text-[11px] bg-wine-500/15 text-wine-300 rounded px-1.5 py-0.5">🍷 ${w.tasting_count} tasting${w.tasting_count === 1 ? '' : 's'}</span>` : ''}
                                </div>
                                ${w.address && w.address !== w.region ? `<div class="text-xs text-neutral-500 mt-1">${esc(w.address.slice(0, 100))}</div>` : ''}
                                ${w.website ? `<div class="text-xs text-neutral-500 mt-1 truncate">🔗 ${esc(w.website)}</div>` : ''}
                            </div>
                        </div>
                        ${w.id ? `<div class="mt-2 text-right"><span class="text-xs text-wine-400">View winery →</span></div>` : ''}
                    </a>
                `).join('');
            })
            .catch(() => {
                results.innerHTML = '<div class="text-neutral-600 text-sm text-center py-6">Search failed — try again.</div>';
            });
    }, 250);
}

function clearFilters() {
    document.getElementById('filter-region').value = '';
    document.getElementById('filter-sort').value = 'name';
    document.getElementById('filter-tastings').checked = false;
    runSearch();
}

function showImportForm() {
    document.getElementById('import-form').classList.toggle('hidden');
}

document.body.addEventListener('htmx:afterSwap', function(evt) {
    if (evt.detail.target && evt.detail.target.id === 'import-result') {
        try {
            const data = JSON.parse(evt.detail.xhr.responseText);
            document.getElementById('import-result').innerHTML = 
                `<div class="text-sm text-green-400 mt-2">✅ Imported ${data.imported} wineries (${data.skipped} skipped, ${data.found} found)</div>`;
        } catch(e) {
            // Non-JSON response
        }
    }
});
</script>
{% endblock %}
