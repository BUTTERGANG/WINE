{% extends "base.html" %}
{% block title %}Map{% endblock %}
{% block content %}
<div class="h-[calc(100vh-3.5rem)] relative">
    <!-- Overlay controls -->
    <div class="absolute top-4 left-4 z-[1000] flex flex-col gap-2">
        <!-- View mode -->
        <div class="flex bg-neutral-900/90 backdrop-blur-sm rounded-lg border border-neutral-700 p-0.5">
            <button id="filter-my" class="px-3 py-1.5 rounded-md text-xs font-medium transition hover:bg-neutral-800"
                    onclick="toggleFilter('my')">📍 My</button>
            <button id="filter-all" class="px-3 py-1.5 rounded-md text-xs font-medium bg-wine-600 text-white transition"
                    onclick="toggleFilter('all')">🌍 All</button>
            <button id="filter-wineries" class="px-3 py-1.5 rounded-md text-xs font-medium transition hover:bg-neutral-800"
                    onclick="toggleFilter('wineries')">🏘️ Wineries</button>
        </div>
        <!-- Map mode toggle -->
        <div class="flex bg-neutral-900/90 backdrop-blur-sm rounded-lg border border-neutral-700 p-0.5">
            <button id="mode-pins" class="px-3 py-1.5 rounded-md text-xs font-medium bg-wine-600 text-white transition"
                    onclick="setMapMode('pins')">📍 Pins</button>
            <button id="mode-heat" class="px-3 py-1.5 rounded-md text-xs font-medium transition hover:bg-neutral-800"
                    onclick="setMapMode('heat')">🔥 Heat</button>
        </div>
        <!-- Radius selector -->
        <div class="bg-neutral-900/90 backdrop-blur-sm rounded-lg border border-neutral-700 px-3 py-2">
            <label class="text-xs text-neutral-400 block mb-1">Radius: <span id="radius-label">50</span> km</label>
            <input type="range" min="5" max="500" value="50" step="5" id="radius-slider"
                   class="w-24 accent-wine-500"
                   oninput="document.getElementById('radius-label').textContent=this.value; debounceLoadPins()">
        </div>
        <!-- Wine type filter -->
        <div class="bg-neutral-900/90 backdrop-blur-sm rounded-lg border border-neutral-700 px-3 py-2">
            <select id="type-filter" class="bg-transparent text-xs text-neutral-300 border-none focus:outline-none" onchange="debounceLoadPins()">
                <option value="">All types</option>
                <option value="red">Red</option>
                <option value="white">White</option>
                <option value="rosé">Rosé</option>
                <option value="sparkling">Sparkling</option>
            </select>
        </div>
    </div>

    <!-- Near me button -->
    <button id="near-me-btn" class="absolute bottom-8 right-4 z-[1000] bg-wine-600 hover:bg-wine-500 text-white px-4 py-2 rounded-full text-sm font-medium shadow-lg transition flex items-center gap-2"
            onclick="findNearMe()">
        📍 Near Me
    </button>

    <div id="wine-map" class="w-full h-full"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script>
let map;
let markersLayer;
let heatLayer;
let currentMapMode = 'pins';
let currentFilter = 'all';
let loadTimer;

function initMap() {
    map = L.map('wine-map').setView([40, -95], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 18,
    }).addTo(map);

    markersLayer = L.layerGroup().addTo(map);

    navigator.geolocation?.getCurrentPosition(pos => {
        map.setView([pos.coords.latitude, pos.coords.longitude], 10);
    }, () => {});

    map.on('moveend', () => debounceLoadPins());
    loadPins();
}

function debounceLoadPins() {
    clearTimeout(loadTimer);
    loadTimer = setTimeout(() => loadPins(currentFilter), 300);
}

const MY_ID = '{{ user.id if user else "" }}';

function loadPins(userFilter) {
    if (userFilter !== undefined) currentFilter = userFilter;
    return currentMapMode === 'heat' ? loadHeat() : loadMarkers();
}

function loadHeat() {
    markersLayer.clearLayers();
    const typeFilter = document.getElementById('type-filter').value;
    fetch(`/api/locations/heatmap${typeFilter ? '?wine_type=' + encodeURIComponent(typeFilter) : ''}`)
        .then(r => r.json())
        .then(data => {
            if (heatLayer) { map.removeLayer(heatLayer); heatLayer = null; }
            const points = data.points || [];
            if (points.length) {
                heatLayer = L.heatLayer(points, {
                    radius: 30, blur: 20, maxZoom: 10, max: 1.0,
                    gradient: { 0.2: '#6366f1', 0.5: '#e98844', 0.8: '#ef4444' },
                }).addTo(map);
            }
        })
        .catch(() => {});
}

function loadMarkers() {
    const center = map.getBounds().getCenter();
    const radius = document.getElementById('radius-slider').value;
    const typeFilter = document.getElementById('type-filter').value;

    markersLayer.clearLayers();
    if (heatLayer) map.removeLayer(heatLayer);

    // Winery mode — load winery pins instead of tasting pins
    if (userFilter === 'wineries') {
        loadWineries(center, radius);
        return;
    }

    let url = `/api/locations/nearby?lat=${center.lat}&lon=${center.lng}&radius=${radius}`;
    if (currentFilter === 'my' && MY_ID) url += `&user_id=${encodeURIComponent(MY_ID)}`;

    fetch(url)
        .then(r => r.json())
        .then(data => {
            markersLayer.clearLayers();
            if (heatLayer) { map.removeLayer(heatLayer); heatLayer = null; }

            let features = data.features || [];
            if (typeFilter) features = features.filter(f => f.properties.wine_type === typeFilter);

            if (!features.length) {
                L.marker(center)
                    .bindPopup('<div style="text-align:center">No wine pins in this area.<br><a href="/wine/add" style="color:#e98844">Add one!</a></div>')
                    .addTo(markersLayer);
                return;
            }

            features.forEach(f => {
                const coords = f.geometry.coordinates;
                const p = f.properties;
                const icon = L.divIcon({
                    className: 'wine-pin' + (p.user_id === MY_ID ? ' my-wine' : ''),
                    html: '<div></div>', iconSize: [24, 24], iconAnchor: [12, 24],
                });
                const photo = p.photo_url
                    ? `<img src="${esc(p.photo_url)}" alt="" style="width:100%;height:90px;object-fit:cover;border-radius:6px;margin-bottom:4px">` : '';
                L.marker([coords[1], coords[0]], { icon })
                    .bindPopup(
                        '<div style="min-width:180px">' + photo +
                        '<div style="font-weight:600;margin-bottom:4px">' + esc(p.wine_name) + '</div>' +
                        '<div style="font-size:12px;color:#e6b800">' + stars(p.rating) + '</div>' +
                        '<div style="font-size:12px;color:#999">' + esc(p.location_name) + '</div>' +
                        '<div style="font-size:11px;color:#777">by ' + esc(p.username) + '</div>' +
                        (p.notes ? '<div style="font-size:11px;color:#888;margin-top:4px">“' + esc(p.notes) + '”</div>' : '') +
                        '<div style="margin-top:6px"><a href="/wine/' + encodeURIComponent(p.wine_id) + '" style="color:#e98844;font-size:12px">View wine →</a></div>' +
                        '</div>'
                    )
                    .addTo(markersLayer);
            });
        })
        .catch(() => {});
}

function setMapMode(mode) {
    currentMapMode = mode;
    document.getElementById('mode-pins').className = 'px-3 py-1.5 rounded-md text-xs font-medium transition ' +
        (mode === 'pins' ? 'bg-wine-600 text-white' : 'hover:bg-neutral-800');
    document.getElementById('mode-heat').className = 'px-3 py-1.5 rounded-md text-xs font-medium transition ' +
        (mode === 'heat' ? 'bg-wine-600 text-white' : 'hover:bg-neutral-800');
    loadPins();
}

function toggleFilter(filter) {
    currentFilter = filter;
    // Clear all highlights
    document.getElementById('filter-my').className = 'px-3 py-1.5 rounded-md text-xs font-medium transition hover:bg-neutral-800';
    document.getElementById('filter-all').className = 'px-3 py-1.5 rounded-md text-xs font-medium transition hover:bg-neutral-800';
    document.getElementById('filter-wineries').className = 'px-3 py-1.5 rounded-md text-xs font-medium transition hover:bg-neutral-800';
    // Highlight selected
    const btn = document.getElementById(filter === 'my' ? 'filter-my' : filter === 'all' ? 'filter-all' : 'filter-wineries');
    btn.className = 'px-3 py-1.5 rounded-md text-xs font-medium bg-wine-600 text-white transition';
    loadPins(filter);
}

function loadWineries(center, radius) {
    fetch(`/api/wineries/nearby?lat=${center.lat}&lon=${center.lng}&radius=${radius}`)
        .then(r => r.json())
        .then(data => {
            const features = data.features || [];
            if (!features.length) {
                L.marker([center.lat, center.lng])
                    .bindPopup('<div style="text-align:center;color:#666">No wineries found in this area.<br><a href="/wineries" style="color:#e98844">Import some!</a></div>')
                    .addTo(markersLayer);
                return;
            }
            features.forEach(f => {
                const coords = f.geometry.coordinates;
                const p = f.properties;
                const icon = L.divIcon({
                    className: 'wine-pin',
                    html: '<div style="background:#6b4e3a!important"></div>',
                    iconSize: [24, 24],
                    iconAnchor: [12, 24],
                });
                L.marker([coords[1], coords[0]], { icon })
                    .bindPopup(`
                        <div style="min-width:180px">
                            <div style="font-weight:600;margin-bottom:4px">🏘️ ${p.name}</div>
                            ${p.address ? `<div style="font-size:11px;color:#999">${p.address}</div>` : ''}
                            ${p.tasting_count ? `<div style="font-size:12px;color:#e98844;margin-top:4px">🍷 ${p.tasting_count} tastings here</div>` : ''}
                            ${p.website ? `<div style="font-size:11px;color:#777;margin-top:2px"><a href="${p.website}" target="_blank" style="color:#e98844">Website →</a></div>` : ''}
                            <div style="margin-top:6px">
                                <a href="/api/wineries/${p.id}" style="color:#e98844;font-size:12px">View winery →</a>
                            </div>
                        </div>
                    `)
                    .addTo(markersLayer);
            });
        });
}

function findNearMe() {
    if (!navigator.geolocation) {
        alert('Geolocation not available');
        return;
    }
    navigator.geolocation.getCurrentPosition(pos => {
        map.setView([pos.coords.latitude, pos.coords.longitude], 12);
        loadPins(currentFilter);
    }, () => {
        alert('Could not get your location');
    });
}

document.addEventListener('DOMContentLoaded', initMap);
</script>
{% endblock %}
