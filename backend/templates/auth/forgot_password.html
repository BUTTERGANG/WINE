{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-16" data-animate>
    <div class="bg-neutral-900 rounded-xl p-8 border border-neutral-800">
        <h1 class="text-2xl font-display text-center mb-2">Forgot Password</h1>
        <p class="text-neutral-500 text-sm text-center mb-6">Enter your email and we'll send you a reset link</p>
        
        <form action="/api/auth/forgot-password" method="post" class="space-y-4">
            <div>
                <label class="block text-sm text-neutral-400 mb-1">Email</label>
                <input type="email" name="email" required
                    placeholder="you@example.com"
                    class="w-full bg-neutral-800 border border-neutral-700 rounded-lg px-3 py-2.5 text-sm focus:border-wine-500 focus:outline-none focus:ring-1 focus:ring-wine-500">
            </div>
            <button type="submit" class="w-full bg-wine-600 hover:bg-wine-500 text-white font-medium py-2.5 rounded-lg transition">Send Reset Link</button>
        </form>
        
        <p class="text-xs text-neutral-500 text-center mt-4">
            <a href="/api/auth/login" class="text-wine-400 hover:underline">Back to login</a>
        </p>
    </div>
</div>
{% endblock %}
