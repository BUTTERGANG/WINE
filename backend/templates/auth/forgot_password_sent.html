{% extends "base.html" %}
{% block title %}Reset Link Sent{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-16" data-animate>
    <div class="bg-neutral-900 rounded-xl p-8 border border-neutral-800">
        <h1 class="text-2xl font-display text-center mb-2">Check Your Email</h1>
        <p class="text-neutral-500 text-sm text-center mb-6">
            If an account exists for {{ email }}, a reset link has been sent.
        </p>

        <p class="text-xs text-neutral-500 text-center">
            <a href="/api/auth/login" class="text-wine-400 hover:underline">Back to login</a>
        </p>
    </div>
</div>
{% endblock %}
