{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-16" data-animate>
    <div class="bg-neutral-900 rounded-xl p-8 border border-neutral-800">
        <h1 class="text-2xl font-display text-center mb-2">Welcome Back</h1>
        <p class="text-neutral-500 text-sm text-center mb-6">Log in to track your tastings</p>
        
        {% if error %}
        <div class="bg-red-900/30 border border-red-700 text-red-300 rounded-lg px-4 py-2 mb-4 text-sm">{{ error }}</div>
        {% endif %}

        <form action="/api/auth/login" method="post" class="space-y-4">
            <div>
                <label class="block text-sm text-neutral-400 mb-1">Email or Username</label>
                <input type="text" name="email" required
                    placeholder="wine@example.com or wine_lover"
                    class="w-full bg-neutral-800 border border-neutral-700 rounded-lg px-3 py-2.5 text-sm focus:border-wine-500 focus:outline-none focus:ring-1 focus:ring-wine-500">
            </div>
            <div>
                <label class="block text-sm text-neutral-400 mb-1">Password</label>
                <input type="password" name="password" required
                    placeholder="password"
                    class="w-full bg-neutral-800 border border-neutral-700 rounded-lg px-3 py-2.5 text-sm focus:border-wine-500 focus:outline-none focus:ring-1 focus:ring-wine-500">
            </div>
            <button type="submit" class="w-full bg-wine-600 hover:bg-wine-500 text-white font-medium py-2.5 rounded-lg transition">Log In</button>
        </form>

        <!-- Demo quick-login buttons -->
        <div class="mt-6 pt-6 border-t border-neutral-800">
            <p class="text-xs text-neutral-500 text-center mb-3">Quick demo login (password: <code class="text-neutral-400">password</code>)</p>
            <div class="grid grid-cols-2 gap-2">
                <form action="/api/auth/login" method="post">
                    <input type="hidden" name="email" value="wine_lover">
                    <input type="hidden" name="password" value="password">
                    <button class="w-full bg-neutral-800 hover:bg-neutral-700 text-xs text-neutral-300 py-2 rounded-lg border border-neutral-700 transition">🍷 wine_lover</button>
                </form>
                <form action="/api/auth/login" method="post">
                    <input type="hidden" name="email" value="sommelier_sam">
                    <input type="hidden" name="password" value="password">
                    <button class="w-full bg-neutral-800 hover:bg-neutral-700 text-xs text-neutral-300 py-2 rounded-lg border border-neutral-700 transition">🧑‍🍳 sommelier_sam</button>
                </form>
                <form action="/api/auth/login" method="post">
                    <input type="hidden" name="email" value="cabernet_queen">
                    <input type="hidden" name="password" value="password">
                    <button class="w-full bg-neutral-800 hover:bg-neutral-700 text-xs text-neutral-300 py-2 rounded-lg border border-neutral-700 transition">👑 cabernet_queen</button>
                </form>
                <form action="/api/auth/login" method="post">
                    <input type="hidden" name="email" value="sparkling_steve">
                    <input type="hidden" name="password" value="password">
                    <button class="w-full bg-neutral-800 hover:bg-neutral-700 text-xs text-neutral-300 py-2 rounded-lg border border-neutral-700 transition">🥂 sparkling_steve</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
