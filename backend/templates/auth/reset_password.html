{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-16" data-animate>
    <div class="bg-neutral-900 rounded-xl p-8 border border-neutral-800">
        <h1 class="text-2xl font-display text-center mb-2">Reset Password</h1>
        <p class="text-neutral-500 text-sm text-center mb-6">Enter your new password</p>
        
        {% if error %}
        <div class="bg-red-900/30 border border-red-700 text-red-300 rounded-lg px-4 py-2 mb-4 text-sm">{{ error }}</div>
        {% endif %}
        
        <form action="/api/auth/reset-password" method="post" class="space-y-4">
            <input type="hidden" name="token" value="{{ token }}">
            <div>
                <label class="block text-sm text-neutral-400 mb-1">New Password</label>
                <input type="password" name="password" required minlength="8"
                    placeholder="At least 8 characters"
                    class="w-full bg-neutral-800 border border-neutral-700 rounded-lg px-3 py-2.5 text-sm focus:border-wine-500 focus:outline-none focus:ring-1 focus:ring-wine-500">
            </div>
            <button type="submit" class="w-full bg-wine-600 hover:bg-wine-500 text-white font-medium py-2.5 rounded-lg transition">Reset Password</button>
        </form>
    </div>
</div>
{% endblock %}
